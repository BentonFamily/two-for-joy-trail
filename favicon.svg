<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a5f5a"/>
      <stop offset="50%" stop-color="#1f6f8f"/>
      <stop offset="100%" stop-color="#3a3f8f"/>
    </linearGradient>
  </defs>

  <circle cx="32" cy="32" r="32" fill="#faf7f2"/>

  <!-- Long pointed tail, iridescent -->
  <path d="M 38 36 L 59 22 L 57 30 Z" fill="url(#sheen)"/>

  <!-- Main body -->
  <ellipse cx="28" cy="34" rx="17" ry="13" fill="#17181a"/>

  <!-- White belly patch -->
  <ellipse cx="26" cy="37" rx="8" ry="7" fill="#faf7f2"/>

  <!-- Iridescent wing/shoulder patch -->
  <ellipse cx="35" cy="28" rx="4.5" ry="7" transform="rotate(-20 35 28)" fill="url(#sheen)"/>

  <!-- Head -->
  <circle cx="18" cy="23" r="9" fill="#17181a"/>

  <!-- Beak -->
  <path d="M 10 23 L 2 21 L 10 20 Z" fill="#e8a33d"/>

  <!-- Eye -->
  <circle cx="17" cy="21" r="1.7" fill="#faf7f2"/>

  <!-- Legs -->
  <path d="M 23 46 L 21 52 M 30 46 L 30 52" stroke="#17181a" stroke-width="2.5" stroke-linecap="round"/>
</svg>
