<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="#0d4e43"/>

  <!-- Bold tail, single clean triangle -->
  <path d="M 260 260 L 430 160 L 400 250 Z" fill="#0b171a"/>

  <!-- Body, simple rounded blob -->
  <ellipse cx="210" cy="270" rx="110" ry="90" fill="#0b171a"/>

  <!-- White belly -->
  <ellipse cx="195" cy="295" rx="58" ry="50" fill="#ffffff"/>

  <!-- Head -->
  <circle cx="150" cy="185" r="65" fill="#0b171a"/>

  <!-- Beak -->
  <path d="M 90 185 L 30 170 L 90 155 Z" fill="#0b171a"/>

  <!-- Eye -->
  <circle cx="140" cy="165" r="12" fill="#ffffff"/>

  <!-- Legs, thick and short so they hold up small -->
  <path d="M 175 350 L 165 400 M 225 350 L 225 400" stroke="#0b171a" stroke-width="16" stroke-linecap="round"/>
</svg>
