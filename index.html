<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Two for Joy Trail</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="shortcut icon" href="favicon.ico">
<style>
  :root {
    --ink: #17181a;
    --cream: #faf7f2;
    --teal: #1f6f8f;
    --teal-deep: #1a5f5a;
    --indigo: #3a3f8f;
    --gold: #e8a33d;
    --brand-gradient: linear-gradient(135deg, var(--teal-deep), var(--teal) 55%, var(--indigo));
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: var(--cream);
    color: var(--ink);
    max-width: 480px;
    margin: 0 auto;
    padding: 16px;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  h1 .brand-dot {
    display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    background: var(--brand-gradient); margin-right: 8px;
  }
  h2 { font-size: 16px; margin: 20px 0 8px; color: var(--ink); }
  p.sub { color: #666; font-size: 13px; margin-top: 0; }
  select, button, input {
    font-size: 15px;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
    width: 100%;
    margin-bottom: 8px;
  }
  button { background: var(--brand-gradient); color: #fff; border: none; cursor: pointer; }
  button.secondary { background: #fff; color: var(--teal); border: 1px solid var(--teal); }
  button.test { background: #fff; color: #8a6d00; border: 1px dashed #d4b106; font-size: 12px; padding: 6px 8px; }
  .card { border: 1px solid #ddd; border-radius: 8px; padding: 14px; margin-bottom: 12px; background: #fff; }
  .card.done { background: #eef7ee; border-color: #a8d5a8; }
  .card.locked { background: #fdf0f0; border-color: #e0b4b4; }
  .station-num {
    display: inline-block; background: var(--brand-gradient); color: #fff; border-radius: 50%;
    width: 28px; height: 28px; text-align: center; line-height: 28px; font-weight: 600; margin-right: 6px;
  }
  .letter-tile {
    display: inline-block; background: var(--brand-gradient); color: #fff; padding: 4px 10px;
    border-radius: 4px; font-size: 16px; margin: 2px; font-weight: 600;
  }
  .msg { font-size: 13px; margin-top: 4px; }
  .msg.error { color: #b3261e; }
  .msg.ok { color: #2e7d32; }
  .progress { background: #eee; border-radius: 4px; height: 8px; overflow: hidden; margin-bottom: 12px; }
  .progress-bar { background: var(--brand-gradient); height: 100%; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 4px 5px; border-bottom: 1px solid #eee; }
  .tabs { display: flex; gap: 6px; margin-bottom: 16px; }
  .tabs button { width: auto; flex: 1; font-size: 13px; }
  .note { font-size: 12px; color: #888; border-top: 1px solid #eee; margin-top: 20px; padding-top: 10px; }
  .hint { font-size: 12px; color: #666; font-style: italic; margin-top: 4px; }
  a.reveal-link { color: var(--teal); font-weight: 600; }
  @keyframes confetti-fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 0.9; }
    100% { transform: translateY(105vh) rotate(360deg); opacity: 0.4; }
  }
</style>
</head>
<body>

<div style="text-align:center; margin-bottom:4px;">
  <img src="magpies-banner.png" alt="Two magpies" style="max-width:220px; width:100%; height:auto;">
</div>
<h1 style="text-align:center;"><span class="brand-dot"></span>Two for Joy Trail</h1>
<p class="sub" style="text-align:center;">Ten stations. Seven teams. One shared goal, we're all in this together. Let's cause some chaos.</p>
<div id="photoLinkBar"></div>

<div id="storageBanner" style="display:none; background:#fff3cd; color:#664d03; padding:8px 10px; border-radius:6px; font-size:13px; margin-bottom:12px;"></div>

<div class="tabs">
  <button id="tabTeam" onclick="setTab('team')">Team view</button>
  <button id="tabCombine" class="secondary" onclick="setTab('combine')">Combine</button>
  <button id="tabRules" class="secondary" onclick="setTab('rules')">Rules</button>
  <button id="tabOrg" class="secondary" onclick="setTab('org')">Organiser</button>
</div>

<div id="rulesView" style="display:none;">
  <div id="rulesContent"></div>
</div>

<div id="teamView">
  <h2>Pick your team</h2>
  <select id="teamSelect" onchange="onTeamChange()"></select>
  <div id="teamContent"></div>
</div>

<div id="combineView" style="display:none;">
  <div id="combineContent"></div>
</div>

<div id="orgView" style="display:none;">
  <div id="orgGate">
    <h2>Organiser access</h2>
    <input type="text" id="orgPasscodeInput" placeholder="Enter organiser passcode">
    <button onclick="checkOrgPasscode()">Unlock</button>
    <div class="msg error" id="orgGateMsg"></div>
  </div>
  <div id="orgContent" style="display:none;"></div>
</div>



<script>
const ORG_PASSCODE = "MAGPIE2026"; // change this before the day

// ---- Config: 10 physical stations, same challenge for every team ----
const STATIONS = [
  { id: 1, title: "Three legged race", prompt: "Enter your race time (e.g. 0:42)", validation: { type: "number" } },
  { id: 2, title: "Wedding day laugh", prompt: "Type one word from the story you heard", validation: { type: "text" } },
  { id: 3, title: "The First Riddle", prompt: "Type your answer to the riddle", validation: { type: "exact", answer: "OAK" }, hint: "Hint: squirrels bury these every autumn, and some grow into very old trees." },
  { id: 4, title: "Tallest tower", prompt: "Measure your tower's height in cm, enter the number", validation: { type: "number" } },
  { id: 5, title: "The Magic Square", prompt: "Type your answer to the puzzle", validation: { type: "exact", answer: "HOPE" }, hint: "Hint: every row and column adds up to the same total." },
  { id: 6, title: "The Second Riddle", prompt: "Type your answer to the riddle", validation: { type: "exact", answer: "NEST" }, hint: "Hint: it's what a bird builds to keep its eggs safe." },
  { id: 7, title: "A Question for Henry & Caro", prompt: "Type one word summing up your chosen question or story", validation: { type: "text" } },
  { id: 8, title: "Write a Poem", prompt: "Type one word that sums up your poem", validation: { type: "text" } },
  { id: 9, title: "Recreate the Photo", prompt: "Enter how many people are in your recreation photo", validation: { type: "number" } },
  { id: 10, title: "Magpie group photo", prompt: "Type how many people are in your photo", validation: { type: "number" } },
];

function validateAnswer(station, rawVal) {
  const val = (rawVal || '').trim();
  if (station.validation.type === 'exact') {
    return val.toUpperCase() === station.validation.answer;
  }
  if (station.validation.type === 'number') {
    return /\d/.test(val);
  }
  if (station.validation.type === 'text') {
    return val.length >= 2;
  }
  return false;
}

// ---- Config: 7 teams. 3 build what3words words, 4 build digit-words for a 4 digit code ----
const TEAMS_RAW = [
  { name: "One for Sorrow",     kind: "number", target: "SEVEN", digit: 7, hint: "A lucky number for some" },
  { name: "Two for Joy",        kind: "number", target: "THREE", digit: 3, hint: "Legs in that relay race, sort of" },
  { name: "Three for a Girl",   kind: "word",   target: "ACCENT",    hint: "Changes depending on where in the world you're from" },
  { name: "Four for a Boy",     kind: "word",   target: "ENCOURAGE", hint: "What you do when you cheer someone on" },
  { name: "Five for Silver",    kind: "word",   target: "SWITCHED",  hint: "Past tense of flipping something over" },
  { name: "Six for Gold",       kind: "number", target: "NINE",  digit: 9, hint: "One short of a perfect round number" },
  { name: "Seven for a Secret", kind: "number", target: "FIVE",  digit: 5, hint: "Fingers on one hand" },
];

// ---- Default answer key, editable later from Organiser settings ----
const DEFAULT_SETTINGS = {
  correctWordOrder: ["ACCENT", "ENCOURAGE", "SWITCHED"],
  correctDigitOrder: [7, 3, 9, 5],
  w3wAddress: "accent.encourage.switched"
};

// ---- Deterministic seeded shuffle ----
function hashStr(s) { let h = 0; for (let i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) | 0; } return h; }
function mulberry32(seed) {
  return function() {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function seededShuffle(arr, seedStr) {
  const rand = mulberry32(hashStr(seedStr));
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

// ---- Build each team's route and letter-station map ----
const TEAMS = TEAMS_RAW.map((team, teamIndex) => {
  const route = [];
  for (let k = 0; k < 10; k++) { route.push(((teamIndex + k) % 10) + 1); }
  const L = team.target.length;
  // Spread the L letter-stops evenly across the 10-stop route rather than
  // clustering them at the start, so letters and fillers are staggered.
  const routePositions = [];
  for (let i = 0; i < L; i++) { routePositions.push(Math.floor(i * 10 / L)); }
  const letterOrder = seededShuffle([...Array(L).keys()], team.name + '-order');
  const stationLetterMap = {};
  for (let i = 0; i < L; i++) {
    const stationNum = route[routePositions[i]];
    const letterIdx = letterOrder[i];
    stationLetterMap[stationNum] = team.target[letterIdx];
  }
  return { ...team, route, wordLength: L, stationLetterMap };
});

function slug(s) { return s.toLowerCase().replace(/\s+/g, '-'); }

// ---- Backend: your Firebase Realtime Database URL goes here ----
const FIREBASE_DB_URL = "https://two-for-joy-trail-default-rtdb.europe-west1.firebasedatabase.app/";

// ---- Optional: a shared album link for photo/video tasks (tower, magpie pose, wishes video) ----
// Create a Google Photos "shared album" (with "let anyone add photos" turned on) or a
// Drive folder anyone-with-link-can-upload-to, and paste that link here. Leave the
// placeholder in place to hide the photo link entirely until you've set one up.
const PHOTO_ALBUM_URL = "https://drive.google.com/drive/folders/1_rJ5BruC2Tuw3_3n_DwHZc_GUxfpRA0-?usp=sharing";

// ---- Optional: direct WhatsApp links for "need help" moments ----
// wa.me only supports one recipient per link, so each contact gets their own.
// Numbers use international format, digits only, no + or spaces.
const WHATSAPP_CONTACTS = [
  { name: "Henry", number: "447584419392" },
  { name: "Caro", number: "447795098389" },
];
const WHATSAPP_MESSAGE = "Hi! We need a hand with the Two for Joy Trail game.";

function currentStationContext() {
  if (!currentTeam || !currentTeamProgress) return null;
  const team = TEAMS.find(t => t.name === currentTeam);
  const progress = currentTeamProgress;
  if (progress.solved) return `${currentTeam} has already solved their word.`;
  if (progress.stopIndex >= 10) return `${currentTeam} is unscrambling their word.`;
  const stationNum = team.route[progress.stopIndex];
  const station = STATIONS.find(s => s.id === stationNum);
  return `${currentTeam} needs help at Station ${stationNum} (${station.title}).`;
}

function whatsappLinks() {
  const context = currentStationContext();
  const message = WHATSAPP_MESSAGE + (context ? ' ' + context : '');
  return WHATSAPP_CONTACTS
    .filter(c => c.number && !c.number.startsWith('PASTE_YOUR'))
    .map(c => ({ name: c.name, url: `https://wa.me/${c.number}?text=${encodeURIComponent(message)}` }));
}

// Generic storage backed by Firebase Realtime Database's REST API, with a
// local in-memory cache as a same-session safety net if a call ever fails.
const memoryFallback = {};
let sawStorageFailure = false;

function showFallbackBanner(text) {
  const el = document.getElementById('storageBanner');
  if (el) { el.style.display = 'block'; el.textContent = text; }
}

function firebasePath(key) {
  return FIREBASE_DB_URL.replace(/\/$/, '') + '/' + encodeURIComponent(key) + '.json';
}

async function backendGet(key) {
  const res = await fetch(firebasePath(key));
  if (!res.ok) throw new Error('Firebase GET failed: ' + res.status);
  return await res.json(); // the stored value directly, or null if not present
}

async function backendSet(key, value) {
  const res = await fetch(firebasePath(key), {
    method: 'PUT',
    body: JSON.stringify(value)
  });
  if (!res.ok) throw new Error('Firebase PUT failed: ' + res.status);
  return true;
}

async function backendDelete(key) {
  const res = await fetch(firebasePath(key), { method: 'DELETE' });
  if (!res.ok) throw new Error('Firebase DELETE failed: ' + res.status);
  return true;
}

async function storeGet(key, fallbackValue) {
  try {
    const val = await backendGet(key);
    if (val === null || val === undefined) return fallbackValue;
    memoryFallback[key] = val;
    return val;
  } catch (e) {
    console.error('Backend get failed for', key, e);
    if (!sawStorageFailure) { sawStorageFailure = true; showFallbackBanner("Couldn't reach the Firebase backend, running on temporary memory for this session. Check the Database URL and that the rules allow read/write."); }
    return memoryFallback[key] !== undefined ? memoryFallback[key] : fallbackValue;
  }
}

async function storeSet(key, value) {
  memoryFallback[key] = value;
  try {
    await backendSet(key, value);
    return true;
  } catch (e) {
    console.error('Backend set failed for', key, e);
    if (!sawStorageFailure) { sawStorageFailure = true; showFallbackBanner("Couldn't reach the Firebase backend, running on temporary memory for this session. Check the Database URL and that the rules allow read/write."); }
    return true; // local cache still holds the value so the UI can proceed
  }
}

async function storeDelete(key) {
  delete memoryFallback[key];
  try {
    await backendDelete(key);
  } catch (e) {
    console.error('Backend delete failed for', key, e);
  }
}

async function testBackendConnection() {
  const msgEl = document.getElementById('connectionMsg');
  msgEl.className = 'msg';
  msgEl.textContent = 'Testing...';
  try {
    await backendGet('__ping__');
    msgEl.className = 'msg ok';
    msgEl.textContent = 'Connected to the Firebase backend.';
  } catch (e) {
    msgEl.className = 'msg error';
    msgEl.textContent = 'Could not connect: ' + e.message + '. Check the Database URL and that the rules allow read/write.';
  }
}

async function getProgress(teamName) {
  return storeGet('trail:progress:' + slug(teamName), { stopIndex: 0, collected: [], solved: false, wrongAttempts: {}, textResponses: {} });
}
async function saveProgress(teamName, progress) {
  return storeSet('trail:progress:' + slug(teamName), progress);
}
async function getSettings() {
  return storeGet('trail:settings', DEFAULT_SETTINGS);
}
async function saveSettings(settings) {
  return storeSet('trail:settings', settings);
}
async function getCombineState() {
  return storeGet('trail:combine', { wordOrderSolved: false, digitOrderSolved: false });
}
async function saveCombineState(state) {
  return storeSet('trail:combine', state);
}

// ---- Celebration effect: confetti + a short chime, no external assets needed ----
function playChime(big) {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const ctx = new AudioCtx();
    const notes = big ? [523.25, 659.25, 783.99, 1046.5] : [523.25, 659.25];
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      const startTime = ctx.currentTime + i * 0.12;
      gain.gain.setValueAtTime(0.0001, startTime);
      gain.gain.exponentialRampToValueAtTime(0.2, startTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.3);
      osc.connect(gain).connect(ctx.destination);
      osc.start(startTime);
      osc.stop(startTime + 0.35);
    });
  } catch (e) { /* audio not available, silently skip */ }
}

function celebrate(big) {
  playChime(big);
  const colours = ['#1f6f8f', '#3a3f8f', '#e8a33d', '#17181a', '#1a5f5a'];
  const count = big ? 60 : 24;
  const container = document.createElement('div');
  container.style.cssText = 'position:fixed; inset:0; pointer-events:none; z-index:9999; overflow:hidden;';
  document.body.appendChild(container);

  for (let i = 0; i < count; i++) {
    const piece = document.createElement('div');
    const size = 6 + Math.random() * 6;
    const left = Math.random() * 100;
    const duration = 1.6 + Math.random() * 1.2;
    const delay = Math.random() * 0.3;
    const colour = colours[Math.floor(Math.random() * colours.length)];
    piece.style.cssText = `position:absolute; top:-5%; left:${left}%; width:${size}px; height:${size}px;
      background:${colour}; opacity:0.9; border-radius:${Math.random() > 0.5 ? '50%' : '2px'};
      animation: confetti-fall ${duration}s ease-in ${delay}s forwards;`;
    container.appendChild(piece);
  }

  setTimeout(() => container.remove(), (big ? 3000 : 2200));
}
let currentTeam = null;
let currentTeamProgress = null; // local cache for the active team, avoids a storage read before every submit
let orgUnlocked = false;

function setTab(tab) {
  document.getElementById('teamView').style.display = tab === 'team' ? 'block' : 'none';
  document.getElementById('combineView').style.display = tab === 'combine' ? 'block' : 'none';
  document.getElementById('rulesView').style.display = tab === 'rules' ? 'block' : 'none';
  document.getElementById('orgView').style.display = tab === 'org' ? 'block' : 'none';
  document.getElementById('tabTeam').className = tab === 'team' ? '' : 'secondary';
  document.getElementById('tabCombine').className = tab === 'combine' ? '' : 'secondary';
  document.getElementById('tabRules').className = tab === 'rules' ? '' : 'secondary';
  document.getElementById('tabOrg').className = tab === 'org' ? '' : 'secondary';
  if (tab === 'combine') renderCombine();
  if (tab === 'rules') renderRules();
  if (tab === 'org') renderOrgGate();
  stopOrgPolling();
  if (tab === 'org' && orgUnlocked) startOrgPolling();
}

let orgPollHandle = null;
let allTeamsSolvedNotified = false;

function startOrgPolling() {
  if (orgPollHandle) return;
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
  orgPollHandle = setInterval(() => { renderOrg(); }, 12000);
}

function stopOrgPolling() {
  if (orgPollHandle) { clearInterval(orgPollHandle); orgPollHandle = null; }
}

function resumeOrgPollingIfIdle() {
  // Small delay so tabbing between settings fields doesn't briefly resume
  // polling (and wipe the next field) in the gap between blur and focus.
  setTimeout(() => {
    const settingsFieldIds = ['settingW3w', 'settingWordOrder', 'settingDigitOrder'];
    const active = document.activeElement;
    if (active && settingsFieldIds.includes(active.id)) return;
    if (orgUnlocked) startOrgPolling();
  }, 250);
}

function checkOrgPasscode() {
  const val = document.getElementById('orgPasscodeInput').value;
  if (val === ORG_PASSCODE) {
    orgUnlocked = true;
    renderOrgGate();
    renderOrg();
    startOrgPolling();
  } else {
    document.getElementById('orgGateMsg').textContent = 'Wrong passcode.';
  }
}

function renderOrgGate() {
  document.getElementById('orgGate').style.display = orgUnlocked ? 'none' : 'block';
  document.getElementById('orgContent').style.display = orgUnlocked ? 'block' : 'none';
}

function populateTeamSelect() {
  const sel = document.getElementById('teamSelect');
  sel.innerHTML = '<option value="">Choose your team...</option>' +
    TEAMS.map(t => `<option value="${t.name}">${t.name}</option>`).join('');
}

async function onTeamChange() {
  currentTeam = document.getElementById('teamSelect').value;
  lastResult = null;
  currentTeamProgress = null;
  if (!currentTeam) { document.getElementById('teamContent').innerHTML = ''; return; }
  currentTeamProgress = await getProgress(currentTeam);
  await renderTeam();
}

let lastResult = null; // transient, not persisted: { letter, stationNum } for the confirmation screen

async function renderTeam() {
  const team = TEAMS.find(t => t.name === currentTeam);
  const container = document.getElementById('teamContent');
  if (!currentTeamProgress) currentTeamProgress = await getProgress(currentTeam);
  const progress = currentTeamProgress;

  const pct = Math.round((progress.stopIndex / 10) * 100);
  let html = `<div class="progress"><div class="progress-bar" style="width:${pct}%"></div></div>`;
  html += `<p class="sub">${progress.stopIndex} of 10 stations done &middot; ${progress.collected.length} of ${team.wordLength} letters collected</p>`;
  if (!progress.solved && !lastResult) {
    html += `<button class="test" onclick="testFastForwardTeam()">Test: fast-forward this whole team (1 storage write)</button>`;
  }

  if (lastResult) {
    html += `<div class="card done">
      <h2>${lastResult.letter ? 'Correct!' : 'Well done!'}</h2>
      ${lastResult.letter
        ? `<p>You found a letter: <span class="letter-tile">${lastResult.letter}</span></p>`
        : `<p>No letter at this one.</p>`}
      ${lastResult.nextStationNum
        ? `<p><strong>Head to Station ${lastResult.nextStationNum} next.</strong></p>`
        : `<p><strong>That's all 10 stations, time to unscramble your word.</strong></p>`}
      <button onclick="dismissResult()">Continue</button>
    </div>`;
    container.innerHTML = html;
    renderPhotoLink();
    return;
  }

  if (progress.solved) {
    html += `<div class="card done">
      <h2>Solved!</h2>
      <p>Your word is <span class="letter-tile">${team.target}</span></p>
      <p class="sub">${team.kind === 'word' ? 'One of the three words in the what3words location. Head to the Combine tab to help place it in order.' : 'This spells the digit ' + team.digit + '. Head to the Combine tab to help place it in order.'}</p>
    </div>`;
  } else if (progress.stopIndex >= 10) {
    html += `<div class="card">
      <h2>Unscramble your word</h2>
      <p>Your collected letters, in the order you found them:</p>
      <p>${progress.collected.map(l => `<span class="letter-tile">${l}</span>`).join('')}</p>
      <p class="sub">Rearrange them into a real word (${team.wordLength} letters) and type your answer below.</p>
      <input type="text" id="unscrambleInput" placeholder="Your answer">
      <button onclick="submitUnscramble()">Submit</button>
      <button class="test" onclick="testFillUnscramble()">Test: fill correct answer</button>
      <div class="msg" id="unscrambleMsg"></div>
    </div>`;
  } else {
    const stationNum = team.route[progress.stopIndex];
    const station = STATIONS.find(s => s.id === stationNum);
    const priorWrong = (progress.wrongAttempts && progress.wrongAttempts[stationNum]) || 0;
    html += `<div class="card">
      <div><span class="station-num">${stationNum}</span> <strong>${station.title}</strong></div>
      <input type="text" id="stationInput" placeholder="${station.prompt}">
      <button onclick="submitStation(${stationNum})">Submit</button>
      <button class="test" onclick="testFillStation(${stationNum})">Test: fill correct answer</button>
      <div class="msg" id="stationMsg">${priorWrong >= 3 && station.hint ? station.hint : ''}</div>
    </div>`;
  }

  container.innerHTML = html;
  renderPhotoLink();
}

function dismissResult() {
  lastResult = null;
  renderTeam();
}

let submitInFlight = false;

function testFillStation(stationNum) {
  const station = STATIONS.find(s => s.id === stationNum);
  const dummy = station.validation.type === 'exact' ? station.validation.answer
    : station.validation.type === 'number' ? '42'
    : 'test';
  document.getElementById('stationInput').value = dummy;
  submitStation(stationNum);
}
function testFillUnscramble() {
  const team = TEAMS.find(t => t.name === currentTeam);
  document.getElementById('unscrambleInput').value = team.target;
  submitUnscramble();
}

async function testFastForwardTeam() {
  // Completes the whole route in one go, using a single storage write,
  // rather than one read+write per station. Avoids tripping any rate limit
  // during quick testing. Not for use during the real event, testing only.
  const team = TEAMS.find(t => t.name === currentTeam);
  const progress = { stopIndex: 10, collected: [], solved: true, textResponses: {} };
  // Rebuild the letters in the exact scrambled order the team would have collected them
  for (let i = 0; i < 10; i++) {
    const stationNum = team.route[i];
    const letter = team.stationLetterMap[stationNum];
    if (letter) progress.collected.push(letter);
  }
  const ok = await saveProgress(currentTeam, progress);
  currentTeamProgress = progress;
  const msgEl = document.getElementById('stationMsg') || document.getElementById('unscrambleMsg');
  if (!ok && msgEl) { msgEl.className = 'msg error'; msgEl.textContent = 'Could not save, try again.'; return; }
  lastResult = null;
  await renderTeam();
}

async function submitStation(stationNum) {
  if (submitInFlight) return;
  submitInFlight = true;
  try {
    const team = TEAMS.find(t => t.name === currentTeam);
    const station = STATIONS.find(s => s.id === stationNum);
    const input = document.getElementById('stationInput');
    const msgEl = document.getElementById('stationMsg');
    const val = input.value || '';

    if (!validateAnswer(station, val)) {
      if (station.validation.type === 'exact') {
        const progress = currentTeamProgress;
        if (!progress.wrongAttempts) progress.wrongAttempts = {};
        progress.wrongAttempts[stationNum] = (progress.wrongAttempts[stationNum] || 0) + 1;
        await saveProgress(currentTeam, progress);
        msgEl.className = 'msg error';
        msgEl.textContent = progress.wrongAttempts[stationNum] >= 3 && station.hint
          ? 'Not quite, try again. ' + station.hint
          : 'Not quite, try again.';
      } else {
        msgEl.className = 'msg error';
        msgEl.textContent = 'Please enter an answer to continue.';
      }
      return;
    }

    const progress = currentTeamProgress;
    // Guard: if this station isn't actually the team's current station, ignore
    // (protects against a duplicate or delayed submission changing the wrong step)
    if (team.route[progress.stopIndex] !== stationNum) { return; }

    const letter = team.stationLetterMap[stationNum];
    if (letter) progress.collected.push(letter);
    if (station.validation.type === 'text') {
      if (!progress.textResponses) progress.textResponses = {};
      progress.textResponses[stationNum] = val.trim();
    }
    progress.stopIndex += 1;
    const ok = await saveProgress(currentTeam, progress);
    if (!ok) { msgEl.className = 'msg error'; msgEl.textContent = 'Could not save, try again.'; return; }
    const nextStationNum = progress.stopIndex < 10 ? team.route[progress.stopIndex] : null;
    lastResult = { letter: letter || null, stationNum, nextStationNum };
    if (letter) celebrate(false);
    await renderTeam();
  } finally {
    submitInFlight = false;
  }
}

async function submitUnscramble() {
  if (submitInFlight) return;
  submitInFlight = true;
  try {
    const team = TEAMS.find(t => t.name === currentTeam);
    const input = document.getElementById('unscrambleInput');
    const msgEl = document.getElementById('unscrambleMsg');
    const val = (input.value || '').trim().toUpperCase();

    if (val !== team.target) {
      msgEl.className = 'msg error';
      msgEl.textContent = 'Not quite, try again.';
      return;
    }

    const progress = currentTeamProgress;
    progress.solved = true;
    const ok = await saveProgress(currentTeam, progress);
    if (!ok) { msgEl.className = 'msg error'; msgEl.textContent = 'Could not save, try again.'; return; }
    celebrate(true);
    await renderTeam();
  } finally {
    submitInFlight = false;
  }
}

// ---- Combine tab: the group ordering puzzle, done before the box is found ----
async function renderCombine() {
  const container = document.getElementById('combineContent');
  container.innerHTML = '<p>Loading...</p>';

  const [settings, combineState, allProgress] = await Promise.all([
    getSettings(),
    getCombineState(),
    Promise.all(TEAMS.map(team => getProgress(team.name)))
  ]);
  const wordTeams = [];
  const numberTeams = [];
  TEAMS.forEach((team, i) => {
    const progress = allProgress[i];
    if (team.kind === 'word') wordTeams.push({ team, progress });
    else numberTeams.push({ team, progress });
  });
  const solvedWords = wordTeams.filter(w => w.progress.solved);
  const solvedNumbers = numberTeams.filter(n => n.progress.solved);

  let html = '<h2>Word order</h2>';
  html = '<button class="secondary" onclick="renderCombine()">Refresh</button>' + html;
  if (solvedWords.length < 3) {
    html += `<p class="sub">Waiting on ${3 - solvedWords.length} more team(s) to solve their word.</p>`;
    wordTeams.forEach(w => {
      html += `<div class="card"><strong>${w.team.name}</strong>: ${w.progress.solved ? `<span class="letter-tile">${w.team.target}</span>` : 'not solved yet'}<div class="hint">${w.team.hint}</div></div>`;
    });
  } else if (combineState.wordOrderSolved) {
    html += `<div class="card done"><strong>Word order confirmed:</strong> ${settings.correctWordOrder.join(' &rarr; ')}</div>`;
  } else {
    html += '<p class="sub">All three words are in. Use the clues to work out the order, then pick it below.</p>';
    solvedWords.forEach(w => {
      html += `<div class="card"><strong>${w.team.target}</strong><div class="hint">${w.team.hint}</div></div>`;
    });
    html += '<div class="card">';
    for (let i = 0; i < 3; i++) {
      html += `<label>Word ${i + 1}</label><select id="wordSlot${i}">` +
        solvedWords.map(w => `<option value="${w.team.target}">${w.team.target}</option>`).join('') +
        `</select>`;
    }
    html += `<button onclick="checkWordOrder()">Check word order</button>
      <button class="test" onclick="testFillWordOrder()">Test: fill correct order</button>
      <div class="msg" id="wordOrderMsg"></div></div>`;
  }

  html += '<h2>Digit order</h2>';
  if (solvedNumbers.length < 4) {
    html += `<p class="sub">Waiting on ${4 - solvedNumbers.length} more team(s) to solve their number.</p>`;
    numberTeams.forEach(n => {
      html += `<div class="card"><strong>${n.team.name}</strong>: ${n.progress.solved ? `<span class="letter-tile">${n.team.target} = ${n.team.digit}</span>` : 'not solved yet'}<div class="hint">${n.team.hint}</div></div>`;
    });
  } else if (combineState.digitOrderSolved) {
    html += `<div class="card done"><strong>Digit order confirmed:</strong> ${settings.correctDigitOrder.join('')}</div>`;
  } else {
    html += '<p class="sub">All four numbers are in. Use the clues to work out the order, then pick it below.</p>';
    solvedNumbers.forEach(n => {
      html += `<div class="card"><strong>${n.team.target} = ${n.team.digit}</strong><div class="hint">${n.team.hint}</div></div>`;
    });
    html += '<div class="card">';
    for (let i = 0; i < 4; i++) {
      html += `<label>Digit ${i + 1}</label><select id="digitSlot${i}">` +
        solvedNumbers.map(n => `<option value="${n.team.digit}">${n.team.digit} (${n.team.target})</option>`).join('') +
        `</select>`;
    }
    html += `<button onclick="checkDigitOrder()">Check digit order</button>
      <button class="test" onclick="testFillDigitOrder()">Test: fill correct order</button>
      <div class="msg" id="digitOrderMsg"></div></div>`;
  }

  if (combineState.wordOrderSolved && combineState.digitOrderSolved) {
    html += `<div class="card done">
      <h2>Location unlocked</h2>
      <p>What3words: <a class="reveal-link" href="https://what3words.com/${settings.w3wAddress}" target="_blank">///${settings.w3wAddress}</a></p>
      <p>Lockbox code: <span class="letter-tile">${settings.correctDigitOrder.join('')}</span></p>
    </div>`;
  }

  container.innerHTML = html;
}

function testFillWordOrder() {
  getSettings().then(settings => {
    for (let i = 0; i < 3; i++) {
      const sel = document.getElementById('wordSlot' + i);
      if (sel) sel.value = settings.correctWordOrder[i];
    }
    checkWordOrder();
  });
}
function testFillDigitOrder() {
  getSettings().then(settings => {
    for (let i = 0; i < 4; i++) {
      const sel = document.getElementById('digitSlot' + i);
      if (sel) sel.value = settings.correctDigitOrder[i];
    }
    checkDigitOrder();
  });
}

async function checkWordOrder() {
  const settings = await getSettings();
  const guess = [0, 1, 2].map(i => document.getElementById('wordSlot' + i).value);
  const msgEl = document.getElementById('wordOrderMsg');
  const correct = JSON.stringify(guess) === JSON.stringify(settings.correctWordOrder);
  if (correct) {
    const state = await getCombineState();
    state.wordOrderSolved = true;
    await saveCombineState(state);
    celebrate(state.digitOrderSolved ? true : false);
    await renderCombine();
  } else {
    msgEl.className = 'msg error';
    msgEl.textContent = 'Not quite that order, try again.';
  }
}

async function checkDigitOrder() {
  const settings = await getSettings();
  const guess = [0, 1, 2, 3].map(i => Number(document.getElementById('digitSlot' + i).value));
  const msgEl = document.getElementById('digitOrderMsg');
  const correct = JSON.stringify(guess) === JSON.stringify(settings.correctDigitOrder);
  if (correct) {
    const state = await getCombineState();
    state.digitOrderSolved = true;
    await saveCombineState(state);
    celebrate(state.wordOrderSolved ? true : false);
    await renderCombine();
  } else {
    msgEl.className = 'msg error';
    msgEl.textContent = 'Not quite that order, try again.';
  }
}

// ---- Organiser view: progress table plus editable answer key ----
async function renderOrg() {
  const container = document.getElementById('orgContent');
  if (!container.dataset.loadedOnce) { container.innerHTML = '<p>Loading...</p>'; }

  const [settings, allProgress] = await Promise.all([
    getSettings(),
    Promise.all(TEAMS.map(team => getProgress(team.name)))
  ]);

  let rows = '';
  TEAMS.forEach((team, i) => {
    const progress = allProgress[i];
    let whereNow;
    if (progress.solved) {
      whereNow = 'Solved';
    } else if (progress.stopIndex >= 10) {
      whereNow = 'Unscrambling';
    } else {
      whereNow = 'Station ' + team.route[progress.stopIndex];
    }
    rows += `<tr>
      <td>${team.name}</td><td>${team.kind}</td><td>${whereNow}</td><td>${progress.stopIndex}/10</td>
      <td>${progress.collected.length}/${team.wordLength}</td><td>${progress.solved ? team.target : '-'}</td>
    </tr>`;
  });

  const allSolved = allProgress.every(p => p.solved);
  if (allSolved && !allTeamsSolvedNotified) {
    allTeamsSolvedNotified = true;
    celebrate(true);
    if ('Notification' in window && Notification.permission === 'granted') {
      new Notification('Two for Joy Trail', { body: 'All 7 teams have solved their word!' });
    }
  }
  if (!allSolved) { allTeamsSolvedNotified = false; }

  let html = allSolved ? `<div class="card done"><strong>All 7 teams have solved their word!</strong> Head to the Combine tab to work out the final order.</div>` : '';
  html += `<h2>All teams</h2>
    <div class="card">
      <p class="sub">Backend: Firebase Realtime Database &middot; auto-refreshing</p>
      <button class="secondary" onclick="testBackendConnection()">Test connection</button>
      <div class="msg" id="connectionMsg"></div>
    </div>
    <button class="secondary" onclick="renderOrg()">Refresh</button>
    <table><tr><th>Team</th><th>Type</th><th>Where now</th><th>Stations</th><th>Letters</th><th>Word</th></tr>${rows}</table>`;

  const textStationIds = STATIONS.filter(s => s.validation.type === 'text').map(s => s.id);
  let wordsHtml = '';
  TEAMS.forEach((team, i) => {
    const progress = allProgress[i];
    const responses = progress.textResponses || {};
    const entries = textStationIds.filter(id => responses[id]);
    if (entries.length === 0) return;
    wordsHtml += `<div class="card"><strong>${team.name}</strong><br>`;
    entries.forEach(id => {
      const station = STATIONS.find(s => s.id === id);
      wordsHtml += `<span class="sub">Station ${id} (${station.title}): </span><span class="letter-tile">${responses[id]}</span> `;
    });
    wordsHtml += `</div>`;
  });

  html += `<h2>Team words</h2>
    <p class="sub">Every word submitted for the poem, the question, and other open-ended stations, a nice thing to look back on afterwards.</p>
    ${wordsHtml || '<p class="sub">Nothing submitted yet.</p>'}`;

  html += `<h2>Answer key (editable)</h2>
    ${settings.correctDigitOrder.join('') === '7395' ? `<div class="card locked"><strong>Reminder:</strong> the digit order below is still the placeholder (7395). Set your real 4-digit code before the day.</div>` : ''}
    <div class="card">
      <label>What3words address</label>
      <input type="text" id="settingW3w" value="${settings.w3wAddress}" onfocus="stopOrgPolling()" onblur="resumeOrgPollingIfIdle()">
      <label>Word order (comma separated)</label>
      <input type="text" id="settingWordOrder" value="${settings.correctWordOrder.join(',')}" onfocus="stopOrgPolling()" onblur="resumeOrgPollingIfIdle()">
      <label>Digit order (4 digits, no spaces)</label>
      <input type="text" id="settingDigitOrder" value="${settings.correctDigitOrder.join('')}" onfocus="stopOrgPolling()" onblur="resumeOrgPollingIfIdle()">
      <button onclick="saveOrgSettings()">Save answer key</button>
      <div class="msg" id="settingsMsg"></div>
    </div>

    <h2>Offline backup</h2>
    <div class="card">
      <p class="sub">Generates a printable page from whatever the answer key above currently says, right now, live. Save it as a PDF or print it, and you've got an always-current paper backup with no need to come back here.</p>
      <button class="secondary" onclick="printOfflineBackup()">Generate printable backup page</button>
    </div>

    <h2>Reset</h2>
    <div class="card">
      <p class="sub">Clears every team's progress and the Combine state, for everyone. Use this between test runs, or before the real event starts.</p>
      ${resetConfirming
        ? `<p><strong>Are you sure?</strong> This can't be undone.</p>
           <button onclick="reallyResetAllData()" style="background:#b3261e;">Yes, reset everything</button>
           <button class="secondary" onclick="cancelReset()">Cancel</button>`
        : `<button class="secondary" onclick="resetAllData()" style="border-color:#b3261e; color:#b3261e;">Reset all data</button>`}
      <div class="msg" id="resetMsg"></div>
    </div>`;

  container.innerHTML = html;
  container.dataset.loadedOnce = 'true';
}

async function saveOrgSettings() {
  const w3w = document.getElementById('settingW3w').value.trim();
  const wordOrder = document.getElementById('settingWordOrder').value.split(',').map(w => w.trim().toUpperCase());
  const digitOrder = document.getElementById('settingDigitOrder').value.trim().split('').map(Number);
  const msgEl = document.getElementById('settingsMsg');

  const settings = { w3wAddress: w3w, correctWordOrder: wordOrder, correctDigitOrder: digitOrder };
  const ok = await saveSettings(settings);
  msgEl.className = ok ? 'msg ok' : 'msg error';
  msgEl.textContent = ok ? 'Saved.' : 'Could not save, try again.';
}

let resetConfirming = false;

function resetAllData() {
  resetConfirming = true;
  renderOrg();
}

function cancelReset() {
  resetConfirming = false;
  renderOrg();
}

async function reallyResetAllData() {
  const keys = TEAMS.map(t => 'trail:progress:' + slug(t.name))
    .concat(['trail:settings', 'trail:combine']);

  for (const key of keys) {
    await storeDelete(key);
  }

  currentTeam = null;
  currentTeamProgress = null;
  lastResult = null;
  resetConfirming = false;
  allTeamsSolvedNotified = false;
  const teamSelectEl = document.getElementById('teamSelect');
  if (teamSelectEl) teamSelectEl.value = '';
  const teamContentEl = document.getElementById('teamContent');
  if (teamContentEl) teamContentEl.innerHTML = '';

  await renderOrg();
  const msgEl = document.getElementById('resetMsg');
  if (msgEl) { msgEl.className = 'msg ok'; msgEl.textContent = 'All data reset.'; }
}

async function printOfflineBackup() {
  const settings = await getSettings();
  const allProgress = await Promise.all(TEAMS.map(team => getProgress(team.name)));

  const exactStations = STATIONS.filter(s => s.validation.type === 'exact');

  let teamSections = '';
  TEAMS.forEach((team, i) => {
    const progress = allProgress[i];
    let rows = '';
    team.route.forEach((stationId, stopIdx) => {
      const station = STATIONS.find(s => s.id === stationId);
      const letter = team.stationLetterMap[stationId] || 'no letter';
      rows += `<tr><td>${stopIdx + 1}</td><td>Station ${stationId}</td><td>${station.title}</td><td><strong>${letter}</strong></td></tr>`;
    });
    teamSections += `
      <h3>${team.name} <span style="color:#1f6f8f;">Target word: ${team.target}${team.kind === 'number' ? ' (digit ' + team.digit + ')' : ''}</span></h3>
      <table>
        <tr><th>Stop</th><th>Station</th><th>Task</th><th>Letter?</th></tr>
        ${rows}
      </table>`;
  });

  let riddleSection = '';
  exactStations.forEach(s => {
    riddleSection += `<p>${s.title} (Station ${s.id}): <strong>${s.validation.answer}</strong></p>`;
  });

  const generatedAt = new Date().toLocaleString('en-GB');

  const doc = `
    <html><head><title>Two for Joy Trail - Offline Backup</title>
    <style>
      body { font-family: -apple-system, Arial, sans-serif; color: #17181a; padding: 20px; max-width: 800px; margin: 0 auto; }
      h1 { margin-bottom: 0; }
      .private { color: #8a1f1f; font-weight: bold; }
      table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 13px; }
      th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid #ddd; }
      .answers { border: 2px solid #8a1f1f; padding: 12px; margin-top: 20px; }
      @media print { button { display: none; } }
    </style>
    </head><body>
      <p class="private">PRIVATE, ORGANISER ONLY, DO NOT SHOW TO TEAMS</p>
      <h1>Two for Joy Trail</h1>
      <p>Offline backup, generated live from current settings on ${generatedAt}</p>
      <button onclick="window.print()">Print / Save as PDF</button>
      <h2>Riddle &amp; puzzle answers</h2>
      ${riddleSection}
      <div class="answers">
        <h2 style="margin-top:0;">Combine answers</h2>
        <p><strong>What3words:</strong> ///${settings.w3wAddress}</p>
        <p><strong>Word order:</strong> ${settings.correctWordOrder.join(' \u2192 ')}</p>
        <p><strong>Digit order:</strong> ${settings.correctDigitOrder.join(' \u2192 ')}</p>
        <p><strong>Lockbox code:</strong> ${settings.correctDigitOrder.join('')}</p>
      </div>
      <h2>Team routes &amp; letters</h2>
      ${teamSections}
    </body></html>
  `;

  const printWin = window.open('', '_blank');
  if (!printWin) { alert('Please allow pop-ups to generate the backup page.'); return; }
  printWin.document.write(doc);
  printWin.document.close();
  printWin.focus();
}
